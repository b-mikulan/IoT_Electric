services:
  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      EWS_URL: "${EWS_URL:-https://bms.iot-electric.hr/EcoStruxure/DataExchange}"
      EWS_USER: "${EWS_USER:-}"
      EWS_PASSWORD: "${EWS_PASSWORD:-}"
      MIDDLEWARE_USER: "${MIDDLEWARE_USER:-}"
      MIDDLEWARE_PASSWORD_HASH: "${MIDDLEWARE_PASSWORD_HASH:-}"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      MIDDLEWARE_URL: "http://middleware:3000"
      MIDDLEWARE_USER: "${MIDDLEWARE_USER:-}"
      MIDDLEWARE_PASSWORD: "${DASHBOARD_MIDDLEWARE_PASSWORD:-}"
      MIDDLEWARE_PASSWORD_FILE: "${DASHBOARD_MIDDLEWARE_PASSWORD_FILE:-}"
      POLL_INTERVAL_MS: "${DASHBOARD_POLL_INTERVAL_MS:-15000}"
      MIDDLEWARE_TIMEOUT_MS: "${DASHBOARD_MIDDLEWARE_TIMEOUT_MS:-10000}"
      DEMO_MODE: "${DASHBOARD_DEMO_MODE:-true}"
      WIDGETS_FILE: "${DASHBOARD_WIDGETS_FILE:-}"
      WIDGETS_JSON: "${DASHBOARD_WIDGETS_JSON:-}"
    volumes:
      - "${DASHBOARD_CONFIG_SOURCE:-./dashboard/config}:/app/config:ro"
    depends_on:
      - middleware
    restart: unless-stopped
